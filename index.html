<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlay IRL – jeden URL</title>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .stage {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      aspect-ratio: 16/9;
      pointer-events: none;
      overflow: visible; /* pozwól zawartości mieć pełny obszar */
    }

    .box {
      position: absolute;
      pointer-events: auto;
    }

    /* Pełny obszar 16:9 (ok. 1920x1080 względem sceny) dla animowanych alertów */
    .cover-all {
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      transform: none;
    }

    .top-left     { left: 24px;  top: 24px; }
    .bottom-left  { left: 24px;  bottom: 24px; }
    .bottom-right { right: 24px; bottom: 24px; }
    .center       { left: 50%;  top: 50%; transform: translate(-50%, -50%); }

    /* Poszerzyłem iframy żeby nie przycinało tekstu */
    .w-medium { width: 620px; height: 160px; }
    .w-wide   { width: 760px; height: 200px; }
    .w-small  { width: 480px; height: 140px; }

    .box iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }

    #tipAlert  { z-index: 30; }
    #botrix    { z-index: 20; }
    #topDonate { z-index: 10; }
    #lastDonate{ z-index: 10; }
    #goal      { z-index: 10; }
  </style>
</head>
<body>
  <div class="stage" role="presentation">

    <!-- BOTRIX – wyśrodkowany -->
    <div id="botrix" class="box cover-all">
      <iframe
        title="Botrix Alerts"
        src="https://botrix.live/alerts?bid=mImY0SOSfEEnIbMs4UPHNg"
        allow="autoplay; clipboard-read; clipboard-write"
        referrerpolicy="no-referrer"
        allowtransparency="true"></iframe>
    </div>

    <!-- TIP ALERT – centrum -->
    <div id="tipAlert" class="box cover-all">
      <iframe
        title="Tipply Tip Alert"
        src="https://widgets.tipply.pl/TIP_ALERT/45acbc83-f00e-41a6-bbcd-4e8078ae7923"
        allow="autoplay; clipboard-read; clipboard-write"
        referrerpolicy="no-referrer"
        allowtransparency="true"></iframe>
    </div>

    <!-- TOP DONATE – lewy górny róg, powiększone okno -->
    <div id="topDonate" class="box top-left w-wide" style="height: 220px;">
      <iframe
        title="Tipply Top Donate"
        src="https://widgets.tipply.pl/LARGEST_MESSAGES/45acbc83-f00e-41a6-bbcd-4e8078ae7923/7e2ac059-e6d8-448f-8a00-99a8bbd85780"
        allow="autoplay; clipboard-read; clipboard-write"
        referrerpolicy="no-referrer"
        allowtransparency="true"></iframe>
    </div>

    <!-- LAST DONATE – prawy dolny róg -->
    <div id="lastDonate" class="box bottom-right w-medium">
      <iframe
        title="Tipply Last Donate"
        src="https://widgets.tipply.pl/LATEST_MESSAGES/45acbc83-f00e-41a6-bbcd-4e8078ae7923/8bb96f04-e8dc-4b7e-8e68-a032c3335840"
        allow="autoplay; clipboard-read; clipboard-write"
        referrerpolicy="no-referrer"
        allowtransparency="true"></iframe>
    </div>

    <!-- CEL DONATE – lewy dolny róg -->
    <div id="goal" class="box bottom-left w-small">
      <iframe
        title="Tipply Goal"
        src="https://widgets.tipply.pl/TIPS_GOAL/45acbc83-f00e-41a6-bbcd-4e8078ae7923/GOAL/284aa312-53e1-460c-8424-70880828c41b"
        allow="autoplay; clipboard-read; clipboard-write"
        referrerpolicy="no-referrer"
        allowtransparency="true"></iframe>
    </div>

  </div>
</body>
</html>
