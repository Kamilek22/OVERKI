<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlay IRL – jeden URL</title>
  <style>
    /* Cała strona transparentna pod YoloBox/OBS */
    html, body { height: 100%; }
    body {
      margin: 0;
      background: transparent; /* ważne! */
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Płótno 16:9, responsywne, zakotwiczone do ekranu */
    .stage {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 56.25vw;     /* 9/16 = 0.5625 */
      max-height: 100vh;
      max-width: 177.78vh; /* 16/9 = 1.7778 */
      aspect-ratio: 16/9;
      pointer-events: none; /* żeby nie łapało klików na Yolo */
    }

    .box {
      position: absolute;
      pointer-events: auto; /* iframe’y mogą nadal reagować jeśli trzeba */
    }

    /* ROGI i centrum – pozycje jak na Twoim screenie */
    .top-left     { left: 24px;  top: 24px; }
    .bottom-left  { left: 24px;  bottom: 24px; }
    .bottom-right { right: 24px; bottom: 24px; }
    .center       { left: 50%;  top: 50%; transform: translate(-50%, -50%); }

    /* Rozmiary okienek – możesz tweekować na żywo w GitHubie */
    .w-medium { width: 520px; height: 140px; }
    .w-wide   { width: 720px; height: 180px; }
    .w-small  { width: 420px; height: 120px; }

    /* Ramki iframów zawsze przezroczyste */
    .box iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }

    /* Warstwy – alert nad innymi (żeby był widoczny podczas animacji) */
    #tipAlert  { z-index: 30; }
    #botrix    { z-index: 20; }
    #topDonate { z-index: 10; }
    #lastDonate{ z-index: 10; }
    #goal      { z-index: 10; }

    /* Opcjonalnie: delikatne safe-area na ultrawide/niestandardowych kadrach */
    .safePadding { inset: 16px; }
  </style>
</head>
<body>
  <div class="stage" role="presentation">

    <!-- BOTRIX – wyśrodkowany -->
    <div id="botrix" class="box center w-wide">
      <iframe
        title="Botrix Alerts"
        src="https://botrix.live/alerts?bid=mImY0SOSfEEnIbMs4UPHNg"
        allow="autoplay; clipboard-read; clipboard-write"
        referrerpolicy="no-referrer"
        allowtransparency="true"></iframe>
    </div>

    <!-- TIP ALERT – też centrum, wyższy z-index, możesz zwęzić/szerzej -->
    <div id="tipAlert" class="box center w-wide" style="top: calc(50% + 120px);">
      <iframe
        title="Tipply Tip Alert"
        src="https://widgets.tipply.pl/TIP_ALERT/45acbc83-f00e-41a6-bbcd-4e8078ae7923"
        allow="autoplay; clipboard-read; clipboard-write"
        referrerpolicy="no-referrer"
        allowtransparency="true"></iframe>
    </div>

    <!-- TOP DONATE – lewy górny róg -->
    <div id="topDonate" class="box top-left w-medium">
      <iframe
        title="Tipply Top Donate"
        src="https://widgets.tipply.pl/LARGEST_MESSAGES/45acbc83-f00e-41a6-bbcd-4e8078ae7923/7e2ac059-e6d8-448f-8a00-99a8bbd85780"
        allow="autoplay; clipboard-read; clipboard-write"
        referrerpolicy="no-referrer"
        allowtransparency="true"></iframe>
    </div>

    <!-- LAST DONATE – prawy dolny róg -->
    <div id="lastDonate" class="box bottom-right w-medium">
      <iframe
        title="Tipply Last Donate"
        src="https://widgets.tipply.pl/LATEST_MESSAGES/45acbc83-f00e-41a6-bbcd-4e8078ae7923/8bb96f04-e8dc-4b7e-8e68-a032c3335840"
        allow="autoplay; clipboard-read; clipboard-write"
        referrerpolicy="no-referrer"
        allowtransparency="true"></iframe>
    </div>

    <!-- CEL DONATE – lewy dolny róg -->
    <div id="goal" class="box bottom-left w-small">
      <iframe
        title="Tipply Goal"
        src="https://widgets.tipply.pl/TIPS_GOAL/45acbc83-f00e-41a6-bbcd-4e8078ae7923/GOAL/284aa312-53e1-460c-8424-70880828c41b"
        allow="autoplay; clipboard-read; clipboard-write"
        referrerpolicy="no-referrer"
        allowtransparency="true"></iframe>
    </div>

  </div>

  <!-- Drobny helper: jeżeli ktoś odpalił stronę w przeglądarce, pokaż info o 16:9 -->
  <script>
    (function() {
      const warn = () => {
        const ar = window.innerWidth / window.innerHeight;
        const ok = Math.abs(ar - 16/9) < 0.06; // tolerancja ~6%
        if (!ok) {
          console.log("Tip: Overlay projektowany pod 16:9 (1920x1080). W YoloBox/OBS będzie się skalować poprawnie.");
        }
      };
      window.addEventListener('resize', warn);
      warn();
    })();
  </script>
</body>
</html>
