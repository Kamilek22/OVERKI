<!-- path: index.html -->
<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlay IRL – SAFE MODE</title>
  <style>
    :root { --align-bottom:-46px; --font:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    html,body{height:100%}
    body{margin:0;background:transparent;overflow:hidden;font-family:var(--font)}
    .root{position:fixed;inset:0;display:grid;place-items:center}
    .canvas{position:relative;width:1920px;height:1080px;background:transparent}
    .box{position:absolute;background:transparent}
    .bottom-left{left:24px;bottom:24px}
    .bottom-right{right:24px;bottom:24px}
    .box iframe{width:100%;height:100%;border:0;background:transparent}
    /* warstwy */
    #lastDonate{z-index:10}
    #goal{z-index:9999} /* GOAL na wierzchu */
    #tipAlert,#botrix{z-index:1;pointer-events:none} /* opcjonalne, wyłączone domyślnie */
    /* debug */
    .debug .box{outline:1px dashed rgba(255,0,0,.6);outline-offset:-1px}
    /* widoczny znacznik “żyję” dla sanity-check */
    .alive{position:absolute;left:8px;top:8px;padding:6px 8px;border-radius:8px;
           background:rgba(0,0,0,.5);color:#fff;font:600 12px/1 var(--font);z-index:10000}
  </style>
</head>
<body>
  <div class="root">
    <div class="canvas" id="canvas">
      <div class="alive">Overlay działa</div>

      <!-- LAST DONATE – prawy dół -->
      <div id="lastDonate" class="box bottom-right" style="width:600px;height:140px;bottom:var(--align-bottom);">
        <iframe id="if-last" title="Tipply Last Donate"
          src=""
          allow="autoplay; clipboard-read; clipboard-write"></iframe>
      </div>

      <!-- GOAL – lewy dół, ta sama wysokość -->
      <div id="goal" class="box bottom-left" style="width:640px;height:140px;bottom:var(--align-bottom);">
        <iframe id="if-goal" title="Tipply Goal"
          src=""
          allow="autoplay; clipboard-read; clipboard-write"></iframe>
      </div>

      <!-- (opcjonalnie) pełnoekranowe warstwy – ukryte domyślnie -->
      <div id="tipAlert" class="box" style="display:none;left:0;top:0;width:1920px;height:1080px;">
        <iframe id="if-tip" title="Tipply Tip Alert" src=""
          allow="autoplay; clipboard-read; clipboard-write; microphone; speakers"></iframe>
      </div>
      <div id="botrix" class="box" style="display:none;left:0;top:0;width:1920px;height:1080px;">
        <iframe id="if-botrix" title="Botrix Alerts" src=""
          allow="autoplay; clipboard-read; clipboard-write"></iframe>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const qs = new URLSearchParams(location.search);
      if (qs.get('debug') === '1') document.body.classList.add('debug');

      // Anty-cache
      const withTs = (url) => {
        const u = new URL(url, location.href);
        u.searchParams.set('_ts', Date.now().toString());
        return u.toString();
      };

      // Minimalny zestaw (działa bez reszty)
      const urls = {
        last: 'https://widgets.tipply.pl/LATEST_MESSAGES/45acbc83-f00e-41a6-bbcd-4e8078ae7923/8bb96f04-e8dc-4b7e-8e68-a032c3335840',
        goal: 'https://widgets.tipply.pl/TIPS_GOAL/45acbc83-f00e-41a6-bbcd-4e8078ae7923/GOAL/284aa312-53e1-460c-8424-70880828c41b',
        tip:  'https://widgets.tipply.pl/TIP_ALERT/45acbc83-f00e-41a6-bbcd-4e8078ae7923',
        bot:  'https://botrix.live/alerts?bid=mImY0SOSfEEnIbMs4UPHNg'
      };

      // Ustaw src
      document.getElementById('if-last').src = withTs(urls.last);
      document.getElementById('if-goal').src = withTs(urls.goal);

      // Opcjonalnie: ?full=1 włącza pełnoekranowe
      if (qs.get('full') === '1') {
        document.getElementById('tipAlert').style.display = 'block';
        document.getElementById('botrix').style.display = 'block';
        document.getElementById('if-tip').src = withTs(urls.tip);
        document.getElementById('if-botrix').src = withTs(urls.bot);
      }
    })();
  </script>
</body>
</html>
